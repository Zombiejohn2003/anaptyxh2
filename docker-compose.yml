services:
  db:
    image: postgres:16
    container_name: sensor-dashboard-db
    environment:
      POSTGRES_DB: sensor_dashboard
      POSTGRES_USER: sensor_user
      POSTGRES_PASSWORD: sensor_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensor_user -d sensor_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
